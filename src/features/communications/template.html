<section class="feature-communications">
  
  <div class="comm-section-header">
    <div>
      <h2 class="comm-section-title">Communications Hub</h2>
      <p class="comm-section-subtitle">Internal messaging, announcements, and department-wide notifications across the organization.</p>
    </div>
    <button class="mc-btn icon-btn" id="comm-primary-action-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Message
    </button>
  </div>

  <div class="comm-workspace-grid">
    
    <div class="comm-threads-panel">
      <div class="comm-panel-header">
        <h3>Active Threads</h3>
      </div>
      
      <div class="comm-threads-list" id="comm-threads-target">
        </div>
    </div>

    <div class="comm-chat-viewer">
      
      <div class="comm-chat-header">
        <div class="comm-user-avatar">DR</div>
        <div>
          <h4 class="comm-chat-subject" id="comm-active-subject">Patient Discharge Coordination Protocol</h4>
          <p class="comm-chat-meta" id="comm-active-meta">Started by Dr. Robert Chen &bull; Radiology Dept</p>
        </div>
        <span class="comm-priority-tag status-mandatory">MANDATORY ACTION</span>
      </div>

      <div class="comm-chat-messages" id="comm-messages-target">
        </div>

      <div class="comm-reply-dock">
        <div class="comm-input-wrapper">
          <input type="text" id="comm-reply-field" placeholder="Type a quick, certified reply to this thread..." />
          <button class="comm-btn-send" id="comm-send-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19l7-7-7-7M5 12h14"/></svg>
          </button>
        </div>
      </div>

    </div>

  </div>
</section>
