<section class="feature-dashboard">
  <header class="dashboard-header">
    <div>
      <h1 id="dashboard-title">Dashboard</h1>
      <p id="dashboard-subtitle" class="dashboard-subtitle"></p>
    </div>
    <div class="dashboard-actions">
      <button id="left-collapse" class="mc-btn">◀</button>
    </div>
  </header>

  <div id="role-cards" class="role-kpi-grid"></div>

  <div class="dashboard-layout">
    <!-- Overview View -->
    <div id="view-overview" class="dashboard-view active">
      <section class="card">
          <div class="section-header">
            <div class="section-title">Recent Activity</div>
            <div>
              <input id="activity-search" type="search" placeholder="Search recent activity">
              <button id="export-csv" class="mc-btn">Export</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
              <tbody id="recent-body"><tr><td colspan="4">Loading…</td></tr></tbody>
            </table>
          </div>
      </section>

      <section class="card">
        <div class="section-header"><div class="section-title">Quick Report</div></div>
        <form id="incident-form">
          <div class="input-group"><label>Title<input id="inc-title" class="input" required></label></div>
          <div class="input-group"><label>Patient<input id="inc-patient" class="input"></label></div>
          <button type="submit" class="mc-btn btn-primary">Submit Report</button>
        </form>
      </section>
    </div>

    <!-- Tasks View -->
    <div id="view-tasks" class="dashboard-view">
      <section class="card">
        <div class="section-header"><div class="section-title">My Tasks</div></div>
        <p class="mc-muted">Assigned tasks and reminders will appear here.</p>
      </section>
    </div>

    <!-- Calendar View -->
    <div id="view-calendar" class="dashboard-view">
      <section class="card">
        <div class="section-header"><div class="section-title">Schedule Overview</div></div>
        <div id="calendar-list" class="calendar-list">Loading appointments...</div>
      </section>
    </div>

    <!-- KPI 1 View (Financial Metrics) -->
    <div id="view-kpi-1" class="dashboard-view">
      <section class="card">
        <div class="section-header"><div class="section-title">Financial Metrics</div></div>
        <div class="kpi-grid">
          <div class="kpi"><div class="label">Revenue</div><div class="value" id="kpi-revenue">KSh 0.00</div></div>
          <div class="kpi"><div class="label">Costs</div><div class="value" id="kpi-costs">KSh 0.00</div></div>
        </div>
      </section>
    </div>
  </div>
</section>
