<div class="audit-layout">
  <div class="section-header">
    <div>
      <h2 class="section-title">🔍 Audit & Compliance</h2>
      <p class="section-subtitle">Track system activities, user actions, and compliance tasks.</p>
    </div>
    <button class="mc-btn btn-secondary btn-sm" id="refresh-audit">Refresh</button>
  </div>

  <div class="filter-bar">
    <input type="search" id="audit-search" class="input" placeholder="Search audit entries..." />
    <select id="audit-filter" class="filter-select">
      <option value="all">All Actions</option>
      <option value="login">Login</option>
      <option value="create">Create</option>
      <option value="update">Update</option>
      <option value="delete">Delete</option>
      <option value="view_patient">View Patient</option>
      <option value="dispense">Dispense</option>
    </select>
  </div>

  <div class="table-wrap">
    <table class="mc-table" id="audit-table">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Action</th>
          <th>Details</th>
          <th>Resource Type</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
