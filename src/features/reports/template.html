<section class="feature-reports">
  <div class="reports-layout">
    <div class="reports-header">
      <h1>📊 Reports & Analytics</h1>
    </div>
    
    <div class="reports-tabs">
      <button class="reports-tab active" data-tab="overview">Overview</button>
      <button class="reports-tab" data-tab="scheduled">Scheduled Reports</button>
      <button class="reports-tab" data-tab="builder">Report Builder</button>
    </div>
    
    <div class="reports-panel active" data-panel="overview">
      <div class="card">
        <div class="section-header">
          <div class="section-title">Available Reports</div>
        </div>
        <div id="reports-grid" class="reports-grid"></div>
      </div>
    </div>
    
    <div class="reports-panel" data-panel="scheduled">
      <div class="card">
        <div class="section-header">
          <div class="section-title">Scheduled Reports</div>
          <button class="mc-btn btn-primary" id="new-scheduled-btn">+ Schedule Report</button>
        </div>
        <div id="scheduled-table-wrap"></div>
        <div id="scheduled-pagination"></div>
      </div>
    </div>
    
    <div class="reports-panel" data-panel="builder">
      <div class="card">
        <div class="section-header">
          <div class="section-title">Custom Report Builder</div>
        </div>
        <form id="report-builder-form" class="report-form">
          <div class="form-row">
            <div class="input-group">
              <label class="input-label">Report Name *</label>
              <input type="text" id="rpt-name" class="input" required>
            </div>
            <div class="input-group">
              <label class="input-label">Data Source *</label>
              <select id="rpt-source" class="input" required>
                <option value="patients">Patients</option>
                <option value="appointments">Appointments</option>
                <option value="encounters">Encounters</option>
                <option value="lab_orders">Lab Orders</option>
                <option value="pharmacy">Pharmacy</option>
                <option value="finance">Finance</option>
                <option value="operations">Operations</option>
                <option value="inventory">Inventory</option>
                <option value="attendance">Attendance</option>
                <option value="leave">Leave</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="input-group">
              <label class="input-label">Columns (comma-separated)</label>
              <input type="text" id="rpt-cols" class="input" placeholder="id, name, date, status">
            </div>
            <div class="input-group">
              <label class="input-label">Filters (JSON)</label>
              <input type="text" id="rpt-filters" class="input" placeholder='{"status": "active"}'>
            </div>
          </div>
          <div class="form-row">
            <div class="input-group">
              <label class="input-label">Sort By</label>
              <input type="text" id="rpt-sort" class="input" placeholder="date DESC">
            </div>
            <div class="input-group">
              <label class="input-label">Limit</label>
              <input type="number" id="rpt-limit" class="input" value="100" min="1" max="1000">
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="mc-btn-secondary" id="preview-report">Preview</button>
            <button type="submit" class="mc-btn btn-primary">Generate Report</button>
          </div>
        </form>
        <div id="report-result" class="report-result"></div>
      </div>
    </div>
  </div>
  
  <!-- Schedule Modal -->
  <div id="scheduled-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width: 480px;">
      <div class="modal-header">
        <h2>Schedule Report</h2>
        <button class="modal-close" id="close-scheduled-modal">&times;</button>
      </div>
      <form id="scheduled-form" class="scheduled-form">
        <div class="form-row">
          <div class="input-group">
            <label class="input-label">Report Name *</label>
            <input type="text" id="sched-name" class="input" required>
          </div>
          <div class="input-group">
            <label class="input-label">Frequency *</label>
            <select id="sched-freq" class="input">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="quarterly">Quarterly</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="input-group">
            <label class="input-label">Data Source *</label>
            <select id="sched-source" class="input">
              <option value="patients">Patients</option>
              <option value="appointments">Appointments</option>
              <option value="finance">Finance</option>
              <option value="operations">Operations</option>
              <option value="inventory">Inventory</option>
            </select>
          </div>
          <div class="input-group">
            <label class="input-label">Recipients (emails, comma-separated)</label>
            <input type="text" id="sched-recipients" class="input" placeholder="admin@org.org, mgr@org.org">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="mc-btn-secondary" id="cancel-scheduled">Cancel</button>
          <button type="submit" class="mc-btn btn-primary">Schedule</button>
        </div>
      </form>
    </div>
  </div>
</section>
