<section class="feature-time-attendance">
  <div class="ta-layout">
    <div class="ta-header">
      <h1>⏰ Time & Attendance</h1>
      <div class="ta-header-actions">
        <button class="mc-btn btn-primary" id="clock-in-btn">Clock In</button>
        <button class="mc-btn btn-secondary" id="clock-out-btn" disabled>Clock Out</button>
      </div>
    </div>
    
    <div class="ta-tabs">
      <button class="ta-tab active" data-tab="today">Today</button>
      <button class="ta-tab" data-tab="history">History</button>
      <button class="ta-tab" data-tab="leave">Leave</button>
      <button class="ta-tab" data-tab="admin" id="ta-admin-tab">Admin</button>
    </div>
    
    <div class="ta-panel active" data-panel="today">
      <div class="card">
        <div class="section-header">
          <div class="section-title">Today's Attendance</div>
        </div>
        <div id="ta-today-content">
          <div class="ta-status-card">
            <div class="ta-status-icon" id="ta-status-icon">🕐</div>
            <div class="ta-status-text" id="ta-status-text">Not clocked in</div>
            <div class="ta-status-detail" id="ta-status-detail">Click Clock In to start your day</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="ta-panel" data-panel="history">
      <div class="card">
        <div class="section-header">
          <div class="section-title">Attendance History</div>
          <div class="filter-bar">
            <input type="month" id="ta-month-filter" class="input" style="width:auto;">
          </div>
        </div>
        <div id="ta-history-table"></div>
      </div>
    </div>
    
    <div class="ta-panel" data-panel="leave">
      <div class="card">
        <div class="section-header">
          <div class="section-title">Leave Requests</div>
          <button class="mc-btn btn-primary" id="new-leave-btn">+ New Leave Request</button>
        </div>
        <div id="ta-leave-table"></div>
      </div>
    </div>
    
    <div class="ta-panel" data-panel="admin">
      <div class="card">
        <div class="section-header">
          <div class="section-title">Attendance Administration</div>
        </div>
        <div id="ta-admin-table"></div>
      </div>
    </div>
  </div>
  
  <!-- Leave Request Modal -->
  <div id="leave-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width: 480px;">
      <div class="modal-header">
        <h2>New Leave Request</h2>
        <button class="modal-close" id="close-leave-modal">&times;</button>
      </div>
      <form id="leave-form" class="leave-form">
        <div class="form-row">
          <div class="input-group">
            <label class="input-label">Leave Type *</label>
            <select id="leave-type" class="input" required>
              <option value="annual">Annual Leave</option>
              <option value="sick">Sick Leave</option>
              <option value="maternity">Maternity Leave</option>
              <option value="paternity">Paternity Leave</option>
              <option value="compassionate">Compassionate Leave</option>
            </select>
          </div>
          <div class="input-group">
            <label class="input-label">Days Count *</label>
            <input type="number" id="leave-days" class="input" required min="0.5" step="0.5" placeholder="e.g. 3">
          </div>
        </div>
        <div class="form-row">
          <div class="input-group">
            <label class="input-label">Start Date *</label>
            <input type="date" id="leave-start" class="input" required>
          </div>
          <div class="input-group">
            <label class="input-label">End Date *</label>
            <input type="date" id="leave-end" class="input" required>
          </div>
        </div>
        <div class="input-group">
          <label class="input-label">Reason</label>
          <textarea id="leave-reason" class="input" rows="3" placeholder="Reason for leave..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="mc-btn-secondary" id="cancel-leave">Cancel</button>
          <button type="submit" class="mc-btn btn-primary">Submit Request</button>
        </div>
      </form>
    </div>
  </div>
</section>
