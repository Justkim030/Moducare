<div class="mc-feature-layout">
  <div class="flex justify-between items-center mb-sp-4">
    <div>
      <h1 class="text-xl font-bold">Clinical Incident Reporting</h1>
      <p class="text-secondary">Hospital Patient Safety & Operational Quality Assurance Log</p>
    </div>
    <button class="btn btn-primary" id="btn-new-incident">🚨 Log New Incident</button>
  </div>

  <div class="grid grid-4 gap-sp-4 mb-sp-6">
    <div class="card stat-card">
      <div class="text-secondary font-medium">Total Tracked</div>
      <div class="text-2xl font-bold" id="stat-total">0</div>
    </div>
    <div class="card stat-card border-left-danger">
      <div class="text-secondary font-medium">Active Reviews</div>
      <div class="text-2xl font-bold text-danger" id="stat-review">0</div>
    </div>
    <div class="card stat-card">
      <div class="text-secondary font-medium">Critical (S1/S2)</div>
      <div class="text-2xl font-bold text-warning" id="stat-critical">0</div>
    </div>
    <div class="card stat-card">
      <div class="text-secondary font-medium">Closed / Resolved</div>
      <div class="text-2xl font-bold text-success" id="stat-closed">0</div>
    </div>
  </div>

  <div class="card p-0">
    <table class="table" id="incident-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Date/Time</th>
          <th>Category</th>
          <th>Severity</th>
          <th>Reporter</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="incident-table-body">
        </tbody>
    </table>
  </div>
</div>

<div id="incident-modal-root" class="mc-modal-backdrop hidden">
  <div class="card p-sp-6 modal-surface">
    <div class="flex justify-between items-center mb-sp-4">
      <h3 id="modal-title" class="text-lg font-bold">Log Clinical Incident</h3>
      <button class="btn btn-icon" id="modal-close">✕</button>
    </div>
    <div id="modal-body-content"></div>
  </div>
</div>
